composite_panels:
  default_review:
    description: Standard panel for general changes
    personas: ["Senior Software Architect", "Python and SQLite Expert", "Hook and Plugin Architecture Expert"]

  server_review:
    description: For kb serve, SSE, HTTP, and search route changes
    personas: ["Async HTTP and SSE Server Expert", "Python and SQLite Expert", "Senior Software Architect"]

  bridge_review:
    description: For agent-bridge, message-bus, and liveness changes
    personas: ["Distributed Systems and Message Bus Expert", "Hook and Plugin Architecture Expert", "Senior Software Architect"]

  hook_review:
    description: For hooks/, scripts/, plugin.json changes
    personas: ["Hook and Plugin Architecture Expert", "Senior Software Architect"]

# Panel selection logic:
# 1. git diff --name-only origin/master...HEAD
# 2. Match each changed file against trigger_paths (glob)
# 3. Union all triggered personas
# 4. If >500 lines changed, always add Senior Software Architect
# Read from BASE BRANCH to prevent a PR from editing its own reviewer panel.
